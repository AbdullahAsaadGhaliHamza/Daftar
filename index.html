function deltaTxt(v, prev, name) {
  if (!prev) return '';
  const d = (v - prev) / prev;
  const s = `${d >= 0 ? '+' : '−'}${Math.abs(d * 100).toFixed(0)}%`;
  return `<span class="${d > 0.1 ? 'neg' : d < -0.1 ? 'pos' : ''}">${s}</span>${name ? ' vs ' + esc(name) : ''}`;
}
function median(a) { const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function findUnusual() {
  const cut = new Date(); cut.setMonth(cut.getMonth() - 6);
  const cutS = `${cut.getFullYear()}-${pad(cut.getMonth() + 1)}-${pad(cut.getDate())}`;
  const ex = S.tx.filter(t => t.type === 'expense' && !t.recurringId);
  const byCat = {};
  ex.forEach(t => (byCat[t.catId] = byCat[t.catId] || []).push(t));
  const out = [];
  for (const list of Object.values(byCat)) {
    if (list.length < 5) continue;
    const med = median(list.map(t => t.amount));
    if (!med) continue;
    for (const t of list) if (t.date >= cutS && t.amount >= med * 2.5 && t.amount - med >= 5000) out.push({ t, x: t.amount / med });
  }
  return out.sort((a, b) => b.t.date.localeCompare(a.t.date)).slice(0, 8);
}
function patterns() {
  const end = toDate(todayStr());
  const start = new Date(end); start.setDate(start.getDate() - 89);
  const startS = `${start.getFullYear()}-${pad(start.getMonth() + 1)}-${pad(start.getDate())}`;
  const ex = S.tx.filter(t => t.type === 'expense' && t.date >= startS && !t.recurringId);
  if (ex.length < 5) return null;
  const first = ex.map(t => t.date).sort()[0];
  const from = toDate(first);
  const counts = new Array(7).fill(0), totals = new Array(7).fill(0);
  for (let d = new Date(from); d <= end; d.setDate(d.getDate() + 1)) counts[d.getDay()]++;
  ex.forEach(t => totals[toDate(t.date).getDay()] += t.amount);
  const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const order = [6, 0, 1, 2, 3, 4, 5]; // Saturday first, matching the Iraqi week
  const avg = i => counts[i] ? totals[i] / counts[i] : 0;
  const week = order.map(i => ({ label: names[i], value: avg(i), tip: `<b>${names[i]}</b><br>Average ${esc(fmtPlain(avg(i)))} per day` }));
  const facts = [];
  const top = order.slice().sort((a, b) => avg(b) - avg(a))[0];
  const overall = sum(totals) / Math.max(1, sum(counts));
  if (avg(top) > 0) facts.push(`You spend the most on <b>${['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'][top]}</b>, about ${esc(fmtPlain(avg(top)))} on average against ${esc(fmtPlain(overall))} on a typical day.`);
  const weekend = (totals[5] + totals[6]) / Math.max(1, counts[5] + counts[6]);
  const weekday = (sum(totals) - totals[5] - totals[6]) / Math.max(1, sum(counts) - counts[5] - counts[6]);
  if (weekday > 0 && weekend > 0) { const r = weekend / weekday; if (r > 1.2 || r < 0.8) facts.push(`Weekend days (Fri and Sat) cost <b>${r > 1 ? (r * 100 - 100).toFixed(0) + '% more' : (100 - r * 100).toFixed(0) + '% less'}</b> than weekdays.`); }
  const big = ex.slice().sort((a, b) => b.amount - a.amount)[0];
  if (big) facts.push(`Largest single expense: <b>${esc(fmtPlain(big.amount))}</b> on ${esc(big.note || cat(big.catId).name)}, ${esc(dayLabel(big.date))}.`);
  const small = ex.filter(t => t.amount <= 5000);
  if (small.length >= 8) facts.push(`<b>${small.length}</b> small purchases under 5,000 IQD added up to ${esc(fmtPlain(sum(small, t => t.amount)))}.`);
  return { week, facts };
}
function yearly() {
  const ys = [...new Set(allMonths().map(m => m.slice(0, 4)))].sort().reverse();
  return ys.map(y => {
    const ms = allMonths().filter(m => m.startsWith(y));
    let inflow = 0, spent = 0, saved = 0; const byCat = {};
    ms.forEach(m => { const s = monthStats(m); inflow += s.inflow; spent += s.spent; saved += s.netSaved; for (const [k, v] of Object.entries(s.byCat)) byCat[k] = (byCat[k] || 0) + v; });
    const top = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    return { year: y, inflow, spent, saved, top: top ? top[0] : null };
  });
}

        S.tx.push(t);
      }
      S.settings.lastCat[st.type] = st.catId;
      ensureMonth(mkOf(date));
      closeSheet();
      commit([mkOf(date), prevMonth]);
      toast(existing ? 'Changes saved' : st.type === 'expense' ? 'Expense added' : 'Income added');
      if (st.type === 'expense') budgetNudge(mkOf(date), st.catId, before);
    };
    $('#tx-save', sheet).addEventListener('click', save);
    form.addEventListener('submit', e => { e.preventDefault(); save(); });

function budgetNudge(mk, cid, before) {
  const b = (monthRec(mk).budgets || {})[cid];
  if (!b) return;
  const now = monthStats(mk).byCat[cid] || 0;
  if (before <= b && now > b) setTimeout(() => toast(`${cat(cid).name} is over budget by ${fmtPlain(now - b)}`, 'bad', 4200), 350);
  else if (before < b * 0.8 && now >= b * 0.8) setTimeout(() => toast(`${cat(cid).name}: ${pct(now / b)} of the budget used`, 'warn', 4200), 350);
}

/* Export / import */
function csvCell(v) { v = String(v ?? ''); return /[",\n\r]/.test(v) || /^[=+\-@]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCsv(rows) { return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }
function exportData(what) {
  const stamp = todayStr();
  if (what === 'tx-csv') {
    const rows = [['Date', 'Type', 'Category', 'Amount (IQD)', 'Original amount', 'Original currency', 'Paid from / goes to', 'Note', 'Recurring']];
    sortTx(S.tx).forEach(t => rows.push([t.date, t.type, cat(t.catId).name, t.amount, t.origAmount ?? t.amount, t.origCur || 'IQD', t.type === 'expense' ? txFrom(t) : txDest(t), t.note || '', t.recurringId ? 'yes' : '']));
    return deliver(`daftar-transactions-${stamp}.csv`, toCsv(rows));
  }
  if (what === 'sav-csv') {
    const rows = [['Date', 'Entry', 'Amount (IQD)', 'Goal change (IQD)', 'Goal', 'Note']];
    savingsHistory().forEach(r => rows.push([r.date, r.title, r.amount, r.goalAmount || '', r.goal || '', r.note || '']));
    return deliver(`daftar-savings-${stamp}.csv`, toCsv(rows));
  }
  return deliver(`daftar-backup-${stamp}.json`, JSON.stringify({ app: 'daftar', exportedAt: new Date().toISOString(), ...S }, null, 2));
}
async function deliver(filename, data) {

    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save is already waiting for your answer', 'warn'); return; } }
  }
  if (!window.claude) {
    try {
      const type = filename.endsWith('.json') ? 'application/json' : 'text/csv';
      const url = URL.createObjectURL(new Blob([data], { type: type + ';charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('File saved');
      return;
    } catch (e) { }
  }
  const short = data.length < 400000;
  openSheet('Copy your export', `<p class="small muted" style="margin:0 0 10px">Saving files isn't available in this view. Copy the contents and paste them into a file named <b>${esc(filename)}</b>.</p>
    <textarea class="field-input" id="exp-text" readonly style="width:100%;height:320px;padding:10px;font-size:12px;font-family:ui-monospace,monospace;border-radius:10px">${short ? esc(data) : ''}</textarea>`,
    `<button class="btn btn-primary" id="exp-copy">Copy to clipboard</button>`, sheet => {
      if (!short) $('#exp-text', sheet).value = data;
      $('#exp-copy', sheet).addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(data); toast('Copied'); }
        catch (e) { const ta = $('#exp-text', sheet); ta.focus(); ta.select(); toast('Select all and copy manually', 'warn'); }
      });
    });
}
async function importFile(file) {
  if (!file) return;
  let parsed;
  try {
    if (file.size > 20 * 1024 * 1024) throw new Error('too big');
    const text = await file.text();
    const raw = JSON.parse(text);
    if (raw.app && raw.app !== 'daftar') throw new Error('wrong app');
    parsed = normalize(raw);
    if (!parsed.onboarded && !parsed.tx.length && !parsed.ledger.length) throw new Error('empty');
  } catch (e) { toast("That file isn't a Daftar backup", 'bad', 4000); return; }
  const ok = await confirmDialog({ title: 'Restore this backup?', body: `It contains ${parsed.tx.length} transactions and ${parsed.goals.length} goals. Everything currently in Daftar will be replaced.`, confirm: 'Replace my data' });
  if (!ok) return;
  const oldMonths = S.tx.map(t => mkOf(t.date));
  S = parsed; S.onboarded = true;
  applyTheme(); afterLoad();
  oldMonths.forEach(m => sync.dirtyMonths.add(m));
  S.tx.forEach(t => sync.dirtyMonths.add(mkOf(t.date)));
  closeSheet();
  commit();
  toast('Backup restored');
}

/* Onboarding */
const onb = { step: 0, savings: 0, pocket: 0, rate: 1450 };
function renderOnboarding() {
  $('.onb')?.remove();
  $('#view').innerHTML = '';
  const mk = curMk();
  const el = document.createElement('div');
  el.className = 'onb';
  const steps = `<div class="onb-steps">${[0, 1, 2, 3].map(i => `<i class="${i <= onb.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let inner = '';
  if (onb.step === 0) inner = `
    <div class="brand" style="padding:0 0 26px"><div class="brand-mark"><span>د</span></div>Daftar</div>
    <h1>Know what you can spend today.</h1>
    <p class="lead">A cash-first money book for life in Iraq. Everything is entered by hand, in dinar by default, with no bank account needed.</p>
    <div class="onb-points">
      <div><span class="row-ico sv">${icon('vault', 18)}</span><span><b>Savings stay separate</b>Money you keep never mixes with your monthly spending unless you move it.</span></div>
      <div><span class="row-ico">${icon('calendar', 18)}</span><span><b>A daily amount that adjusts</b>Your pocket money is split across the days left, after bills are set aside.</span></div>
      <div><span class="row-ico">${icon('plus', 18)}</span><span><b>Five-second entries</b>Amount, category, done. Type 25k for 25,000.</span></div>
    </div>
    <div class="onb-actions"><button class="btn btn-primary" data-onb="next">Set up</button><button class="btn btn-ghost" data-act="import">Restore a backup</button></div>`;
  else if (onb.step === 1) inner = `${steps}
    <h1>How much do you have saved?</h1>
    <p class="lead">Money you keep aside and don't plan to spend this month. Enter 0 if you're starting fresh.</p>
    <form data-onb-form>${amountField({ id: 'onb-amt', value: onb.savings || '', label: 'Current savings' })}</form>
    <div class="onb-actions"><button class="btn btn-primary" data-onb="next">Continue</button><button class="btn btn-ghost" data-onb="back">Back</button></div>`;
  else if (onb.step === 2) inner = `${steps}
    <h1>Pocket money left for ${esc(monthName(mk))}?</h1>
    <p class="lead">The cash you have to spend from today until the end of the month, including bills you still pay from it. From next month on, you'll set the full monthly amount.</p>
    <form data-onb-form>${amountField({ id: 'onb-amt', value: onb.pocket || '', label: 'Pocket money this month', quick: false })}</form>
    <div class="onb-actions"><button class="btn btn-primary" data-onb="next">Continue</button><button class="btn btn-ghost" data-onb="back">Back</button></div>`;
  else inner = `${steps}
    <h1>Your dollar rate</h1>
    <p class="lead">Used when you enter amounts in USD. Set it to what exchange shops give you; you can change it any time in Settings.</p>
    <form data-onb-form><div class="field"><div class="amount-box"><span style="font-size:20px;color:var(--ink-3);white-space:nowrap">1 USD =</span><input id="onb-rate" inputmode="decimal" value="${nf0.format(onb.rate)}" aria-label="IQD per US dollar" autofocus><span style="font-size:18px;color:var(--ink-3)">IQD</span></div></div></form>
    <div class="onb-actions"><button class="btn btn-primary" data-onb="finish">Start using Daftar</button><button class="btn btn-ghost" data-onb="back">Back</button></div>`;
  el.innerHTML = `<div class="onb-card">${inner}</div>`;
  document.body.appendChild(el);
  let amt = null;
  if ($('[data-amount="onb-amt"]', el)) amt = bindAmount(el, 'onb-amt');
  const go = how => {
    if (how === 'back') { onb.step--; renderOnboarding(); return; }
    if (onb.step === 1 || onb.step === 2) {
      const v = amt.input.value.trim() ? amt.iqd : 0;
      if (isNaN(v) || v < 0) { toast('Enter zero or a positive amount', 'bad'); return; }
      if (onb.step === 1) onb.savings = v; else onb.pocket = v;
    }
    if (how === 'finish') {
      const r = parseAmount($('#onb-rate', el).value);
      if (isNaN(r) || r < 100 || r > 100000) { toast('Enter a rate between 100 and 100,000', 'bad'); return; }
      onb.rate = r;
      S.settings.rate = r;
      S.months[mk] = { allowance: Math.round(onb.pocket), budgets: {}, carryIn: 0, carriedOut: 0, settled: null, startDay: new Date().getDate() };
      if (onb.savings > 0) S.ledger.push({ id: newId(), date: todayStr(), kind: 'initial', amount: Math.round(onb.savings), note: '', createdAt: Date.now() });
      S.onboarded = true;
      el.remove();
      location.hash = 'home';
      commit();
      return;
    }
    onb.step++; renderOnboarding();
  };
  el.addEventListener('click', e => { const b = e.target.closest('[data-onb]'); if (b) go(b.dataset.onb); });
  $('[data-onb-form]', el)?.addEventListener('submit', e => { e.preventDefault(); go(onb.step === 3 ? 'finish' : 'next'); });
  const r = $('#onb-rate', el);
  if (r) r.addEventListener('input', () => { if (/^[\d,]*$/.test(r.value)) { const d = r.value.replace(/,/g, ''); r.value = d ? nf0.format(Number(d)) : ''; } });
  setTimeout(() => ($('#onb-amt', el) || r)?.focus(), 50);
}

/* Actions */
const ACTIONS = {
  'close-sheet': () => closeSheet(),
  'add-tx': () => txSheet(null),
  'edit-tx': el => { const t = S.tx.find(x => x.id === el.dataset.id); if (t) txSheet(t); },
  'delete-tx': async el => {
    const t = S.tx.find(x => x.id === el.dataset.id); if (!t) return;
    const ok = await confirmDialog({ title: 'Delete this transaction?', body: `${esc(t.note || cat(t.catId).name)}, ${esc(fmtPlain(t.amount))} on ${esc(dayLabel(t.date))}. This can't be undone.` });
    if (!ok) return;
    S.tx = S.tx.filter(x => x.id !== t.id);
    closeSheet(); commit([mkOf(t.date)]); toast('Transaction deleted');
  },
  'act-tab': el => { act.tab = el.dataset.tab; render(); },
  'f-type': el => { act.type = el.dataset.v; if (act.cat !== 'all' && cat(act.cat).kind !== act.type && act.type !== 'all') act.cat = 'all'; render(); },
  'clear-filters': () => { act.month = 'all'; act.type = 'all'; act.cat = 'all'; act.q = ''; render(); },
  'goto-recurring': () => { act.tab = 'rec'; location.hash = 'activity'; if (route() === 'activity') render(); },
  'add-recurring': () => recurringSheet(null),
  'edit-recurring': el => { const r = S.recurring.find(x => x.id === el.dataset.id); if (r) recurringSheet(r); },
  'delete-recurring': async el => {
    const r = S.recurring.find(x => x.id === el.dataset.id); if (!r) return;
    const ok = await confirmDialog({ title: 'Delete this recurring payment?', body: 'Future reminders stop. Transactions already recorded from it are kept.' });
    if (!ok) return;
    S.recurring = S.recurring.filter(x => x.id !== r.id);
    closeSheet(); commit(); toast('Recurring payment deleted');
  },
  'pay-occ': el => {
    const r = S.recurring.find(x => x.id === el.dataset.id); if (!r) return;
    const ds = el.dataset.date;
    const date = ds <= todayStr() ? ds : todayStr();
    if (r.type === 'expense' && (r.from || 'pocket') === 'savings' && r.amount > savingsSummary().unassigned) { toast('Not enough unassigned savings for this payment', 'bad'); return; }
    const t = { id: newId(), createdAt: Date.now(), type: r.type, amount: r.amount, catId: r.catId, note: r.note, date, origCur: 'IQD', origAmount: r.amount, recurringId: r.id, recurDate: ds };
    if (r.type === 'expense') t.from = r.from || 'pocket'; else t.dest = r.dest || 'pocket';
    S.tx.push(t); commit([mkOf(date)]);
    toast(r.type === 'income' ? 'Marked as received' : 'Marked as paid');
  },
  'skip-occ': el => {
    const r = S.recurring.find(x => x.id === el.dataset.id); if (!r) return;
    r.skipped = [...(r.skipped || []), el.dataset.date].slice(-60);
    commit(); toast('Skipped this time');
  },
  'settle': async el => {
    const mk = el.dataset.mk, how = el.dataset.how;
    const m = S.months[mk]; if (!m) return;
    const left = Math.round(monthStats(mk).pocketLeft);
    if (how === 'save' && left > 0) S.ledger.push({ id: newId(), date: lastDayOf(mk), kind: 'from-pocket', amount: left, goalId: null, goalDelta: 0, note: `Unspent from ${monthName(mk)}`, createdAt: Date.now() });
    if (how === 'carry' && left > 0) { ensureMonth(nextMk(mk)); m.carriedOut = (m.carriedOut || 0) + left; S.months[nextMk(mk)].carryIn = (S.months[nextMk(mk)].carryIn || 0) + left; }
    m.settled = how;
    commit();
    toast(how === 'save' ? `${fmtPlain(left)} moved to savings` : how === 'carry' ? `${fmtPlain(left)} added to ${monthName(nextMk(mk))}` : 'Left as is');
  },
  'to-savings': () => savAddSheet(''),
  'from-savings': () => savTakeSheet('', 'pocket'),
  'sav-add': el => savAddSheet(el.dataset.goal || ''),
  'sav-take': el => savTakeSheet(el.dataset.goal || '', el.dataset.goal ? 'release' : 'pocket'),
  'sav-filter': el => { savFilter.kind = el.dataset.v; render(); },
  'del-ledger': async el => {
    const e = S.ledger.find(x => x.id === el.dataset.id); if (!e) return;
    const ok = await confirmDialog({ title: 'Delete this savings entry?', body: `${e.kind === 'assign' ? 'Goal assignment of ' + esc(fmtPlain(Math.abs(e.goalDelta))) : esc(fmtPlain(Math.abs(e.amount)))} on ${esc(dayLabel(e.date))}. Balances will be recalculated without it.` });
    if (!ok) return;
    S.ledger = S.ledger.filter(x => x.id !== e.id);
    if (e.kind === 'from-pocket' && e.note && e.note.startsWith('Unspent from')) { const mk = mkOf(e.date); if (S.months[mk] && S.months[mk].settled === 'save') S.months[mk].settled = null; }
    commit(); toast('Entry deleted');
  },
  'new-goal': () => goalSheet(null),
  'edit-goal': el => { const g = S.goals.find(x => x.id === el.dataset.id); if (g) goalSheet(g); },
  'delete-goal': async el => {
    const g = S.goals.find(x => x.id === el.dataset.id); if (!g) return;
    const saved = savingsSummary().goalSaved[g.id] || 0;
    const ok = await confirmDialog({ title: `Delete "${esc(g.name)}"?`, body: saved > 0 ? `The ${esc(fmtPlain(saved))} in this goal stays in your savings as unassigned money.` : 'This goal has no money in it.' });
    if (!ok) return;
    S.goals = S.goals.filter(x => x.id !== g.id);
    closeSheet(); commit(); toast('Goal deleted');
  },
  'ins-month': el => { ins.month = el.dataset.mk; render(); },
  'cat-drill': el => { act.month = el.dataset.mk; act.cat = el.dataset.cat; act.type = 'expense'; act.q = ''; act.tab = 'tx'; location.hash = 'activity'; },
  'set-display': el => { S.settings.display = el.dataset.v; commit(); },
  'set-theme': el => { S.settings.theme = el.dataset.v; applyTheme(); commit(); },
  'new-cat': el => categorySheet(null, el.dataset.kind),
  'edit-cat': el => { const c = S.categories.find(x => x.id === el.dataset.id); if (c) categorySheet(c); },
  'delete-cat': async el => {
    const c = S.categories.find(x => x.id === el.dataset.id); if (!c) return;
    const n = S.tx.filter(t => t.catId === c.id).length + S.recurring.filter(r => r.catId === c.id).length;
    const fb = cat(FALLBACK[c.kind]).name;
    const ok = await confirmDialog({ title: `Delete "${esc(c.name)}"?`, body: n ? `${n} record${n === 1 ? '' : 's'} using it will move to "${esc(fb)}". Nothing is lost.` : 'No records use this category.' });
    if (!ok) return;
    const touched = new Set();
    S.tx.forEach(t => { if (t.catId === c.id) { t.catId = FALLBACK[c.kind]; touched.add(mkOf(t.date)); } });
    S.recurring.forEach(r => { if (r.catId === c.id) r.catId = FALLBACK[c.kind]; });
    Object.values(S.months).forEach(m => { if (m.budgets && m.budgets[c.id]) delete m.budgets[c.id]; });
    S.categories = S.categories.filter(x => x.id !== c.id);
    closeSheet(); commit([...touched]); toast('Category deleted');
  },
  'export': el => exportData(el.dataset.what),
  'import': () => { const f = $('#import-file'); f.value = ''; f.click(); },
  'adjust-savings': () => adjustSavingsSheet(),
  'erase': async () => {
    const ok = await confirmDialog({ title: 'Erase all data?', body: 'Every transaction, savings entry, goal and setting will be deleted from this device and your account. Export a backup first if you might need it.', confirm: 'Erase everything' });
    if (!ok) return;
    const months = new Set(S.tx.map(t => mkOf(t.date)));
    S = freshState();
    months.forEach(m => sync.dirtyMonths.add(m));
    onb.step = 0; heroAnimated = false;
    applyTheme();
    commit();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act !== 'goto-recurring') return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet-layer').classList.contains('open') && !$('#dialog-layer').classList.contains('open')) closeSheet();
  const tag = (e.target.tagName || '').toLowerCase();
  if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey && !['input', 'textarea', 'select'].includes(tag) && !$('#sheet-layer').classList.contains('open') && S.onboarded) { e.preventDefault(); txSheet(null); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.cc-col[role="button"]')) { e.preventDefault(); e.target.click(); }
});
$('#import-file').addEventListener('change', e => importFile(e.target.files[0]));

/* Tooltip */
const tip = $('#tip');
let tipPinned = null;
function showTip(el, x, y) {
  const html = el.getAttribute('data-tip'); if (!html) return;
  tip.innerHTML = html; tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (left < 8) left = 8;
  if (top < 8) top = y + 18;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() { tip.classList.remove('show'); tipPinned = null; }
document.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  const el = e.target.closest('[data-tip]');
  if (el) showTip(el, e.clientX, e.clientY); else if (!tipPinned) tip.classList.remove('show');
});
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-tip]');
  if (e.pointerType === 'touch' && el) { const r = el.getBoundingClientRect(); tipPinned = el; showTip(el, r.left + r.width / 2, r.top); }
  else if (!el) hideTip();
});
window.addEventListener('scroll', () => { if (tipPinned) hideTip(); }, { passive: true });

/* Theme */
const darkMq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.settings.theme;
  document.documentElement.dataset.theme = t === 'dark' || (t === 'system' && darkMq.matches) ? 'dark' : 'light';
}
darkMq.addEventListener?.('change', () => { if (S.settings.theme === 'system') applyTheme(); });

/* Month change and other devices */
let lastDay = todayStr();
function onWake() {
  if (todayStr() !== lastDay) { lastDay = todayStr(); if (afterLoad()) commit([], { silent: true }); render(); }
  pullRemote();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onWake(); });
setInterval(() => { if (todayStr() !== lastDay) onWake(); }, 60000);
window.addEventListener('hashchange', () => { hideTip(); if ($('#sheet-layer').classList.contains('open')) closeSheet(); render(); });

/* Boot */
(function boot() {
  const local = loadLocal();
  if (local) S = local;
  applyTheme();
  if (afterLoad()) commit([], { silent: true });
  render();
  connect();
})();
</script>
</body>
